server:
  port: 8080

spring:
  application:
    name: atp-server

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/atp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

atp:
  jwt:
    secret: atp-auto-test-platform-secret-key-please-change-in-production-2026
    expiration: 7200000
    header: Authorization
    token-prefix: "Bearer "
  captcha:
    enabled: false

logging:
  level:
    com.atp: debug
